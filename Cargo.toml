[package]
name = "tz-convert"
version = "0.2.0"
edition = "2024"
authors = ["stackrot <dev@stackrot.dev>"]
description = "Convert times between IANA timezones"
license = "Unlicense"
repository = "https://github.com/stackrot/tz-convert"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
dialoguer = { version = "0.12.0", default-features = false, features = ["fuzzy-select"] }
jiff = "1.0.1"
