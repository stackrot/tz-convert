name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            binary: tz-convert
            name: tz-convert-linux
          - os: windows-2025
            binary: tz-convert.exe
            name: tz-convert-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
      - run: cargo build --release --locked
      - name: Package binary
        env:
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.name }}.zip
        run: |
          python - <<'PY'
          import os
          import zipfile

          binary = os.environ['BINARY']
          with zipfile.ZipFile(os.environ['ASSET'], 'w', zipfile.ZIP_DEFLATED) as archive:
              archive.write('target/release/' + binary, binary)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tz-convert-*
          merge-multiple: true
          path: release
      - name: Publish release
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(date -u +'%Y%m%d%H%M%S')-${GITHUB_RUN_NUMBER}"
          sha256sum tz-convert-linux.zip tz-convert-windows.zip > SHA256SUMS
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF_NOTES
          Automatic build for commit $GITHUB_SHA.

          - Linux: x86-64, glibc 2.35 or newer, system tzdata. Extract and run tz-convert.
          - Windows: x86-64. Extract and run tz-convert.exe.
          - SHA256SUMS contains checksums for both archives.
          EOF_NOTES
          gh release create "$tag" tz-convert-linux.zip tz-convert-windows.zip SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Release $tag" --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
